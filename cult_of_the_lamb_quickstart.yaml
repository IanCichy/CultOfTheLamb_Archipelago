description: Cult of the Lamb - Archipelago quick start
name: PlayerName
game: Cult of the Lamb

# Everything not listed here takes its default - see cult_of_the_lamb_example.yaml for the
# full option list with explanations, or the AP-generated template for every option at once.
Cult of the Lamb:
  # bishops: defeat N of Leshy / Heket / Kallamar / Shamura
  # witnesses: defeat N of Agares / Bathin / Astaroth / Allocer (region's Bishop first)
  # narinder: beat the game - always needs every region, ignores required_count
  goal: bishops
  required_count: 4

  # Only turn this on if you actually own the Woolhaven DLC - the client can't grant
  # content you don't have, and a seed generated with this on is unbeatable without it.
  include_woolhaven: false

  # vanilla_order / randomized / randomized_safe_start (recommended - never starts you at
  # Silk Cradle, whose door costs a Follower sacrifice) / all_unlocked
  region_access_order: randomized_safe_start

  # The big gameplay changes: randomize which weapon/curse families and sermon upgrades
  # you have access to, and turn your Tarot Card collection into checks and items too.
  randomize_weapons: true
  randomize_curses: true
  randomize_sermon_upgrades: true
  randomize_tarot_cards: true
