description: Cult of the Lamb - Archipelago example/test settings
name: IanCotL
game: Cult of the Lamb

Cult of the Lamb:
  # bishops:   defeat N of Leshy / Heket / Kallamar / Shamura
  # witnesses: defeat N of Agares / Bathin / Astaroth / Allocer
  #            (each Witness only becomes fightable after its region's Bishop is beaten)
  goal: bishops

  # How many of the goal's four encounters are required to win (1-4).
  required_count: 4

  # true:  one of the four regions is randomly free at seed start, the other three each
  #        need a "Progressive Bishop's Domain" item (random per-seed unlock order).
  # false: all four regions open from the start.
  randomize_region_access: true

  # Randomize the Temple sermon upgrades. When on, filling the sermon bar sends a check
  # instead of opening the upgrade-choice screen, and the upgrades arrive as Archipelago
  # items. Adds 32 checks (38 with Woolhaven).
  #
  # Might of the Devout, Hearts of the Faithful and Fervour of the Righteous are progressive
  # (the Nth copy grants the Nth tier); everything else - the weapon affixes, curse packs,
  # Heavy Attack masteries and relic unlocks - is its own named item.
  randomize_sermon_upgrades: true

  # Randomize which weapon families you can find. Vanilla hands out the Axe, Dagger, Hammer,
  # Gauntlets, Blunderbuss and Flail on a fixed schedule - the first floor of each run gives
  # you the next one you don't own. With this on that schedule is Archipelago's instead:
  # podiums, chests and choice rooms only offer families the multiworld has granted, and
  # equipping one for the first time sends a check.
  #
  # Your save is never edited - existing weapons aren't taken away - so this is safe to turn
  # on partway through a file. It only changes what gets offered.
  randomize_weapons: true

  # How many weapon families you begin with (1-7). These get neither a check nor an item, so
  # each one removes one of each. 1 is the floor: with nothing granted, every weapon podium
  # in the game would have nothing to put on it.
  starting_weapons: 1

  # Divine Inspiration - the buildings/rituals tree at the Shrine. 69 upgrades, 69 checks.
  # The check fires when you FILL THE DEVOTION METER - the Nth point earned is the Nth check -
  # not when you spend it. Same shape as the sermon bar.
  #
  # off               : no interaction.
  # checks_only       : filling the meter sends a check and you keep the point, as in vanilla.
  # checks_and_points : filling the meter sends a check and the point is taken; points come
  #                     back from Archipelago to spend on whatever you like.
  # checks_and_techs  : the point is taken and never returns; Archipelago grants the upgrades
  #                     directly. The only mode where the multiworld knows what you hold.
  divine_inspiration_mode: checks_and_points

  # Most Devotion one ability point may cost. 0 = leave the game's economy alone.
  #
  # Vanilla climbs to 465 per point, so all 69 cost ~24,000 Devotion - a completionist number.
  # Since every check is a filled meter, uncapped puts most of this block out of reach.
  #   cap 200 -> ~12,300   cap 150 -> ~9,400   cap 100 -> ~6,500   cap 65 -> ~4,300
  divine_inspiration_devotion_cap: 100

  # Rearranges which tier each upgrade sits in. Logic-neutral - the tier gate is a count, not a
  # prerequisite chain - so it combines freely with any mode above.
  #
  # default / random_except_first (tier 1 frozen) / true_random.
  # The five central nodes (Temple, Cult II, Refinery, Cult III, Cult IV) always stay put:
  # each must be bought to open the next tier.
  divine_inspiration_shuffle: default

  # Let Legendary weapons turn up on ordinary weapon podiums, in place of a normal weapon of
  # a family you already hold. off / rare (~1 offer in 10) / common (~1 in 4) / always.
  #
  # WOOLHAVEN ONLY - forced off without include_woolhaven, since Legendaries are DLC content.
  # No check and no item, and the Blacksmith's Broken Hammer questline still unlocks them
  # normally. Note picking one up does add it to your weapon pool for good - the game records
  # whatever you collect - so its plinth will display it early.
  legendary_weapons: off

  # The curse-side counterpart, covering Flaming Shot, Touch of Turua, Divine Blast,
  # Ichor Thrown and Death's Sweep. Fully independent of randomize_weapons - either, both or
  # neither. The Teleport and Barrier curses aren't here; they come from sermon upgrades.
  randomize_curses: true

  # How many curse families you begin with (1-5). Same rules as starting_weapons.
  starting_curses: 1

  # Include content from the paid Woolhaven DLC.
  #
  # Only enable this if you actually own Woolhaven. The client cannot grant DLC content you
  # don't have, so a seed generated with this on and played without the DLC is unbeatable.
  include_woolhaven: false
