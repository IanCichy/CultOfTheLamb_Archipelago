description: Cult of the Lamb, Archipelago full example settings

# Change this to the name you want in the multiworld. Everyone in a game needs a different one.
name: PlayerName
game: Cult of the Lamb
requires:
  version: 0.6.6

# Every option the world supports, set to its default. Delete anything you don't want to
# change. Omitted options use these same values.

Cult of the Lamb:
  # ---------------------------------------------------------------------------
  # Goal
  # ---------------------------------------------------------------------------

  # bishops:   defeat N of Leshy / Heket / Kallamar / Shamura
  # witnesses: defeat N of Agares / Bathin / Astaroth / Allocer
  #            (each Witness only becomes fightable after its region's Bishop is beaten)
  # narinder:  beat the game. Always needs every region, and ignores required_count
  goal: bishops

  # How many of the goal's four encounters are required to win (1-4). Lowering this does not
  # change the location or item counts, only how early the completion condition trips.
  required_count: 4

  # ---------------------------------------------------------------------------
  # Knowing what to aim for
  # ---------------------------------------------------------------------------

  # Adds an Archipelago checklist to the pause menu's Quests tab: the win condition, region
  # access, and one live-progress line per active check block. Pure guidance: it creates no
  # locations and no items, so turning it off changes nothing about the seed.
  archipelago_objective_guide: true

  # How much of that checklist is pinned to the on-screen tracker. The tracker only holds
  # three quest groups at once, so pinning everything costs you sight of whatever else you're
  # tracking. The full list is always in the pause menu regardless.
  #
  # off:        pause menu only
  # goal_only:  the win condition and region access (one or two lines)
  # everything: pin the checklist too, spending two of your three tracker slots
  objective_guide_pinning: goal_only

  # How much of the game's own ~87 follower quests stays in rotation. Most are busywork that
  # pulls against what the multiworld wants, but turning one in is also the main source of
  # follower loyalty XP, so the default trims rather than wipes.
  #
  # unchanged:    vanilla, every quest offered
  # thin_trickle: keep rituals, crusade collections and the follower story chains; drop the rest
  # story_only:   story chains and nothing else
  # none:         no follower quests at all (harshest on follower levelling)
  vanilla_follower_quests: thin_trickle

  # ---------------------------------------------------------------------------
  # Region access
  # ---------------------------------------------------------------------------

  # vanilla_order:         the game's own order, still gated one region at a time
  # randomized:            any region can be the free starting one
  # randomized_safe_start: as randomized, but never Silk Cradle first (getting through it
  #                        costs you a Follower, brutal as an opening move)
  # all_unlocked:          no gating at all, so every region is open from the start
  #
  # (This replaces the old randomize_region_access toggle. true/false still work as aliases
  # for randomized/all_unlocked, but the named values are the real option.)
  region_access_order: randomized_safe_start

  # ---------------------------------------------------------------------------
  # DLC
  # ---------------------------------------------------------------------------

  # Include content from the paid Woolhaven DLC.
  #
  # Only enable this if you actually own Woolhaven. The client cannot grant DLC content you
  # don't have, so a seed generated with this on and played without the DLC is unbeatable.
  #
  # On:  38 sermon checks, Might of the Devout runs to VII, the Flail is a 7th weapon family,
  #      19 extra tarot cards, and legendary_weapons below is allowed to do anything.
  # Off: 32 sermon checks, Might of the Devout stops at VI, 6 weapon families, and
  #      legendary_weapons is forced off regardless of what you set it to.
  include_woolhaven: false

  # ---------------------------------------------------------------------------
  # Weapons and curses
  # ---------------------------------------------------------------------------

  # Randomize which weapon families you can find. Vanilla drip-feeds the Crusader's Blade,
  # Apostate's Cleaver, Traitor's Razor, Warmaker's Hammer, Tempest's Gauntlets and Mayhem's
  # Cannon. The first floor of a run hands you one you don't own,
  # with the later families also gated on Bishops you have beaten. With this on, Archipelago
  # sets the schedule: podiums, chests and choice rooms only offer families the multiworld has
  # granted, and equipping one for the first time sends a check.
  #
  # Your weapons are never taken away, and WeaponPool/CursePool are never written to. Other
  # systems do write to the save, so use a dedicated Archipelago save anyway. This only changes
  # what gets offered.
  randomize_weapons: true

  # How many weapon families you begin with (1-7). These get neither a check nor an item, so
  # each one removes one of each. 1 is the floor: with nothing granted, every weapon podium in
  # the game would have nothing to put on it.
  starting_weapons: 1

  # The curse-side counterpart, covering Flaming Shot, Touch of Turua, Divine Blast, Ichor
  # Thrown and Death's Sweep. Fully independent of randomize_weapons: either, both or
  # neither. Teleport curses aren't here; they come from the Woolhaven sermon upgrade
  # Teleporting Curses instead of crusade drops.
  randomize_curses: true

  # How many curse families you begin with (1-5). Same rules as starting_weapons.
  starting_curses: 1

  # Let Legendary weapons turn up on ordinary weapon podiums, in place of a normal weapon of a
  # family you already hold. off / rare (~1 offer in 10) / common (~1 in 4) / always.
  #
  # WOOLHAVEN ONLY. Forced off without include_woolhaven, since Legendaries are DLC content.
  # No check and no item, and the Blacksmith's Broken Hammer questline still unlocks them
  # normally. Picking one up does add it to your weapon pool for good, because the game
  # records whatever you collect, so its plinth will display it early.
  legendary_weapons: "off"

  # ---------------------------------------------------------------------------
  # Divine Inspiration
  # ---------------------------------------------------------------------------

  # The buildings/rituals tree at the Shrine, not the Temple sermon tree. 69 upgrades, 69
  # checks. THE CHECK FIRES WHEN YOU FILL THE DEVOTION METER, so the Nth point you earn is the
  # Nth check, not when you spend it. Earning is the thing you did; spending is a menu click.
  #
  # off               : no interaction at all.
  # checks_only       : filling the meter sends a check and you keep the point, as in vanilla.
  # checks_and_points : filling the meter sends a check and the point is taken. Points come
  #                     back from Archipelago instead, to spend on whatever you like. 69 out,
  #                     69 back. Same totals as vanilla, just on the multiworld's schedule.
  # checks_and_techs  : the point is taken and never returns; Archipelago grants the upgrades
  #                     directly.
  # curated_checks    : as checks_and_techs, but the 69 upgrades are regrouped into 38 items, so a
  #                     building and all its tiers arrive together, so "Missionary Network" is one
  #                     item rather than three. Five tier-1 upgrades (Temple, Farm Plot, Sleeping
  #                     Bags, Body Pit, Farming Bundle) are free from the start, since without
  #                     them the cult can't function at all. Shorter, too: see the next option.
  #
  #                     Two things stay tiered rather than bundled, because both multiply
  #                     DEVOTION, which is what fills the meter every check here counts:
  #                     Progressive Cult (Shrine 50 -> 175 Devotion, 4 -> 10 followers praying)
  #                     and Progressive Shrine Flame (pray speed, then halved fuel). The
  #                     deeper checks require Progressive Cult copies, so the thing governing
  #                     this block's pace can't turn up last. Resource Production and
  #                     Refining are always early.
  divine_inspiration_mode: checks_and_points

  # How many Divine Inspiration checks the block has (5-69). READ ONLY IN curated_checks. Every
  # other mode always uses all 69.
  #
  # 69 was too many: a full evening reached 22 of them at a Devotion cap of 100, and the cap is 70
  # now, so 30 is about one session.
  #
  # The block can be shorter than its own 38 items. Those just turn up elsewhere in the seed.
  # This world has 80 checks that carry no items of their own (buildings, followers, broom, snail
  # shrines, bosses) and would otherwise pay out filler, so a short block trades Bundles of Lumber
  # for real unlocks. Set it low if you'd rather earn the tree by playing than by praying.
  divine_inspiration_checks: 30

  # Most Devotion a single ability point may cost.
  #
  # Vanilla's curve is 1, 13, 29 ... climbing to 465 and staying there, so all 69 points cost
  # about 24,000 Devotion. Every check here is a filled meter, so uncapped leaves most of this
  # block out of reach. The default is tuned for a seed of roughly six hours. Raise it for a
  # longer game, or set 0 to leave the game's own curve alone.
  #   cap 200 -> ~12,300   cap 150 -> ~9,400   cap 100 -> ~6,500   cap 70 -> ~4,600
  divine_inspiration_devotion_cap: 70

  # Rearranges which tier each upgrade sits in. Logic-neutral: the tier gate is a *count*
  # ("have you bought 10 things"), not a prerequisite chain, so this changes nothing
  # Archipelago places or requires and combines freely with any mode above.
  #
  # default             : the game's own layout
  # random_except_first : tier 1 frozen (Temple, Farm Plot, Sleeping Bags, Body Pit, Farming
  #                       Bundle, Tailor), tiers 2-5 rearranged. Unchanged opening.
  # true_random         : every tier rearranged
  #
  # The five central nodes (Temple, Cult II, Refinery, Cult III, Cult IV) always stay in their
  # own tier, since each must be bought to open the next one, so moving one would make that tier
  # permanently unopenable.
  divine_inspiration_shuffle: default

  # ---------------------------------------------------------------------------
  # Other check blocks
  # ---------------------------------------------------------------------------

  # Randomize the Temple sermon upgrades. When on, filling the sermon bar sends a check
  # instead of opening the upgrade-choice screen, and the upgrades arrive as Archipelago
  # items. 32 checks, or 38 with Woolhaven.
  #
  # Might of the Devout, Hearts of the Faithful and Fervour of the Righteous are progressive
  # (the Nth copy grants the Nth tier). Everything else, meaning the weapon affixes, curse
  # packs, Heavy Attack masteries and relic unlocks, is its own named item.
  randomize_sermon_upgrades: true

  # Randomize the Tarot Card collection. The cards this seed manages are taken out of your
  # collection on connect and come back as Archipelago items. Shop cards are checked at the
  # shop slot, and the 15 the game starts you with are left alone. Adds no logical length,
  # since no card is ever required.
  randomize_tarot_cards: true

  # How many extra Tarot Cards to start with, on top of the 15 the game normally gives you.
  # These have neither a check nor an item, so each one removes one of each. Has no effect
  # with the vanilla_defaults pool below, since those 15 are never randomized.
  starting_tarot_cards: 0

  # Which cards the starting ones are drawn from.
  # vanilla_defaults: the 15 the game normally starts you with
  # any:              any randomizable card, Woolhaven ones included if the DLC is on
  starting_tarot_pool: vanilla_defaults

  # Send a check for each Tarot Card bought from a hub shop (16 slots across the four hubs).
  # A shop card's check is its slot. It does not also get a "Tarot Card - X" unlock check.
  tarot_shop_checks: true

  # Send a check for each of your first 20 recruited Followers. Counted as ever-recruited, so
  # losing Followers can't make a passed milestone unreachable.
  follower_milestone_checks: true

  # Send a check the first time you construct each of 25 curated buildings: Temple, Sleeping
  # Bags, Missionary, Tabernacle, Offering Statue, Confession Booth, Kitchen and so on. Not
  # the ~200 decorations, and not upgrade tiers (except Shelter).
  #
  # First construction only, tracked per seed, so demolishing and rebuilding won't pay twice.
  # Connecting on a save that already has buildings standing sends the whole backlog at once.
  #
  # Nothing behind PleasureSystem / TailorSystem / DiscipleSystem is on the list. Those come
  # from doctrine branches, so a check on one could be permanently unreachable.
  building_checks: true

  # Send a check for each of the 10 broom levels. Sweeping raises your chore level; the levels
  # cost 3, 5, 10, 20, 30, 50, 75, 100, 150 and 200 chore XP, so these trickle in across a run
  # rather than needing to be ground for.
  broom_checks: true

  # Send a check for each of the 5 Snail Shrines you make a Shell offering at.
  snail_shrine_checks: true

  # ---------------------------------------------------------------------------
  # Pacing
  # ---------------------------------------------------------------------------

  # Most sermon XP one Temple upgrade may need, in TENTHS, the unit the game's own bar counts
  # in, so 20 means the bar never shows more than "x/20".
  #
  # The default is tuned for a seed of roughly six hours, which puts the sermon block at about
  # 35 sermons. Raise it for a longer game, or set 0 to leave the game's own curve alone.
  #   cap 50 -> ~80 sermons   cap 30 -> ~51   cap 20 -> ~35   off -> ~150
  sermon_xp_cap: 20

  # Caps the build progress any structure needs at 30. A hammer swing is worth 5, so that's
  # six swings, what a Bed or Farm Plot already costs. Most buildings are 10-180, so this
  # shaves a few seconds off them; the ones it actually changes are the 300-600 tier (Temple
  # III/IV, the shrine upgrades, the repairables). A ceiling, not a floor.
  fast_build: true

  # ---------------------------------------------------------------------------
  # Filler
  # ---------------------------------------------------------------------------

  # What percentage of the filler items in your seed are traps instead (0-50). Traps replace
  # filler only, never a real item, so this can't make a seed harder to complete.
  trap_percentage: 5
