name: Idea or feature request
description: Suggest something the mod should do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before you suggest something, it helps to know what this mod is actually going for.
        
        This is meant to be played as part of an AP world, but isn't meant to turn Cult of the Lamb into a fully randomized experience.  
        The priority is keeping the core gameplay feeling good first, with randomization layered on top.
        
        The best suggestions are the ones that point at a specific problem. 
        What is something that feels repetitive, unclear, or missing right now, and explain how the change would fix it. 
        
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should the mod do?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why it would make a seed better
      description: >-
        What's tedious, confusing or boring right now that this would fix?
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What kind of change is it?
      options:
        - A new check (something you do that sends an item)
        - A new item (something you receive)
        - A quality-of-life change to the base game
        - A new goal or win condition
        - Another option for something that already exists
        - Something else
    validations:
      required: false

